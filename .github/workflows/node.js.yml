name: Node.js CI

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        # Covers the `engines` range in the root package.json; Node 24
        # matches the version pinned in the root `mise.toml`
        node-version: [22, 24]

    steps:
      - uses: actions/checkout@v4

      # pnpm is installed from the root `mise.toml`
      - name: Install tools with mise
        uses: jdx/mise-action@v2
        with:
          install: true
          cache: true

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-

      - name: Install dependencies
        run: mise exec node@${{ matrix.node-version }} -- pnpm install --frozen-lockfile

      - name: Lint
        run: mise exec node@${{ matrix.node-version }} -- pnpm lint

      - name: Build
        run: mise exec node@${{ matrix.node-version }} -- pnpm build

      - name: Run tests
        run: mise exec node@${{ matrix.node-version }} -- pnpm test

  type-check:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        ts-version: ['7.0', next]

    continue-on-error: false

    steps:
      - uses: actions/checkout@v4

      # Node and pnpm versions are pinned in the root `mise.toml`
      - name: Install tools with mise
        uses: jdx/mise-action@v2
        with:
          install: true
          cache: true

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Install TypeScript ${{ matrix.ts-version }}
        run: pnpm add --save-dev typescript@${{ matrix.ts-version }} -w

      - name: Type check
        run: pnpm -r exec tsc --noEmit
